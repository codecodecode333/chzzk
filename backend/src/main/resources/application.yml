spring:
  application:
    name: chzzk
  config:
    # The repo-root .env (KEY=VALUE, shared with docker compose; see .env.example) when run from backend/, so
    # MEDIAMTX_AUTH_SECRET is set in one place. Real environment variables still win.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chzzk}
    username: ${DB_USERNAME:chzzk}
    password: ${DB_PASSWORD:chzzk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  session:
    # Login sessions live in PostgreSQL (ADR-0003), so a backend restart keeps everyone logged in. Flyway creates the
    # tables (V3); the idle timeout comes from server.servlet.session.timeout.
    jdbc:
      initialize-schema: never
  autoconfigure:
    # No generated in-memory user: 회원 log in through the member module, not a UserDetailsService.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  servlet:
    session:
      # 7 days without a request ends a login (Spring Session's idle timeout).
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    # After rejecting an oversize upload (413), keep reading and discarding up to this much of the rest of the
    # body so the browser receives the 413 instead of a connection reset (Tomcat's default is only 2MB).
    # Tomcat caps this at Integer.MAX_VALUE bytes. The form's own size check stays the primary guard.
    max-swallow-size: 2047MB

vod:
  upload:
    # Multipart limits are derived from this (see UploadLimits); keep frontend VITE_VOD_MAX_FILE_SIZE in sync.
    max-file-size: ${VOD_MAX_FILE_SIZE:1GB}
  storage:
    local:
      root: ${VOD_STORAGE_ROOT:./data}

broadcast:
  media-server:
    # MediaMTX control API (compose.yaml binds it to loopback). Used to see who is publishing and to kick publishers.
    api-url: ${MEDIAMTX_API_URL:http://localhost:9997}
    # Shared secret MediaMTX sends on every auth callback (?secret=, set in compose.yaml from the same .env value).
    # Unset or blank: every callback is refused, so nothing can be published or watched.
    auth-secret: ${MEDIAMTX_AUTH_SECRET:}
  publishing-monitor:
    # Polls the media server for who is publishing, then auto-ends 방송 silent for over 60s (PublishingMonitor).
    enabled: true
    interval: 10s

donation:
  expiry:
    # How often PENDING 후원 orders older than 30 minutes are moved to EXPIRED (DonationExpiryJob).
    interval: 1m
  toss:
    # Toss Payments TEST mode only (ADR-0004): every payment is simulated and no money moves. The defaults are the
    # public 결제창 (API 개별 연동) keys from Toss's docs, which Toss now refuses (UNAUTHORIZED_KEY): set your own
    # test keys (test_ck_/test_sk_) from a free Toss developer account in .env (see README, 후원). Tests use a fake.
    # The client key goes to the browser; the secret key never leaves the server.
    client-key: ${TOSS_CLIENT_KEY:test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq}
    secret-key: ${TOSS_SECRET_KEY:test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R}
    api-url: ${TOSS_API_URL:https://api.tosspayments.com}
