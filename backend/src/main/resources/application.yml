spring:
  application:
    name: chzzk-vod
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chzzk}
    username: ${DB_USERNAME:chzzk}
    password: ${DB_PASSWORD:chzzk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # The 영상 파일 limit is enforced while parsing the multipart request, before anything is stored.
      max-file-size: ${vod.upload.max-file-size}
      max-request-size: ${VOD_MAX_REQUEST_SIZE:1100MB}
  mvc:
    problemdetails:
      enabled: true

vod:
  upload:
    max-file-size: ${VOD_MAX_FILE_SIZE:1GB}
  storage:
    local:
      root: ${VOD_STORAGE_ROOT:./data}
