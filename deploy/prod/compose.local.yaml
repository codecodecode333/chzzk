# Local check of the production stack on a PC (README, 공개 배포): Caddy's internal CA instead of Let's Encrypt and
# host ports that don't clash with the dev stack or the kind cluster. Not for the VM.
#
#   docker compose -p chzzk-prodcheck -f deploy/prod/compose.yaml -f deploy/prod/compose.local.yaml \
#     --env-file <file outside the repo> up --build -d
#
# with that file holding PUBLIC_HOST=localhost, PUBLIC_BASE_URL=https://localhost:18443, PUBLIC_IP=127.0.0.1 and
# throwaway POSTGRES_PASSWORD / MEDIAMTX_AUTH_SECRET values. Afterwards: the same command with `down -v --rmi local`.
services:
  caddy:
    environment:
      CADDY_TLS: internal
    ports: !override
      - "18080:80"
      - "18443:443"
  mediamtx:
    ports: !override
      - "18189:8189/udp"   # 라이브 media isn't usable through a remapped port; signaling (/live) still is
